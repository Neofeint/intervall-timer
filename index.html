<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Intervall">
<meta name="theme-color" content="#0f1115">
<title>Intervall-Timer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --fg: #f2f3f5;
    --muted: #9aa0ab;
    --accent: #ff6b3d;
    --prep: #c99a2e;
    --work: #e5532d;
    --rest: #1f9e8f;
    --done: #5b5fd6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: background-color .3s;
  }
  body[data-phase="prep"] { background: var(--prep); }
  body[data-phase="work"] { background: var(--work); }
  body[data-phase="rest"] { background: var(--rest); }
  body[data-phase="done"] { background: var(--done); }

  .screen {
    display: none;
    min-height: 100%;
    padding: calc(env(safe-area-inset-top) + 24px) 16px calc(env(safe-area-inset-bottom) + 24px);
    max-width: 480px;
    margin: 0 auto;
    flex-direction: column;
  }
  .screen.active { display: flex; }

  h1 { font-size: 28px; margin: 8px 0 24px; }

  .row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card);
    border-radius: 16px;
    padding: 12px 12px 12px 18px;
    margin-bottom: 12px;
  }
  .row[hidden] { display: none; }
  .label { font-size: 18px; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .val {
    min-width: 76px; text-align: center;
    font-size: 26px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .step {
    width: 52px; height: 52px;
    border: 0; border-radius: 14px;
    background: #2a2f39; color: var(--fg);
    font-size: 28px; line-height: 1;
  }
  .step:active { background: #3a404c; }

  .toggle-row { padding: 18px 18px; }
  .switch {
    appearance: none; -webkit-appearance: none;
    width: 56px; height: 32px; margin: 0;
    border-radius: 16px; background: #3a404c;
    position: relative; transition: background .2s;
  }
  .switch::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 26px; height: 26px; border-radius: 50%; background: #fff;
    transition: transform .2s;
  }
  .switch:checked { background: var(--rest); }
  .switch:checked::after { transform: translateX(24px); }
  .hint { color: var(--muted); font-size: 14px; margin: -4px 4px 12px; }

  /* Übungen-Karte: Zähler oben, aufklappbare Namen darunter */
  .names-card { background: var(--card); border-radius: 16px; margin-bottom: 12px; }
  .names-card .row { background: none; margin: 0; }
  .names-toggle {
    border: 0; background: none; padding: 0;
    color: var(--fg); font: inherit; text-align: left;
    align-self: stretch;
    display: flex; flex-direction: column; justify-content: center;
  }
  .names-count { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .names-count::after { content: " ›"; display: inline-block; margin-left: 4px; transition: transform .2s; }
  .names-toggle[aria-expanded="true"] .names-count::after { transform: rotate(90deg); }
  .names-list { display: flex; flex-direction: column; gap: 8px; padding: 0 12px 12px; }
  .names-list[hidden] { display: none; }
  .name-input {
    width: 100%; height: 52px;
    border: 0; border-radius: 14px;
    padding: 0 16px;
    background: #2a2f39; color: var(--fg);
    font: inherit; font-size: 18px;
    -webkit-user-select: text; user-select: text;
  }
  .name-input::placeholder { color: var(--muted); }
  .name-input:focus { outline: 2px solid var(--accent); }

  .total { color: var(--muted); text-align: center; margin: 12px 0 0; font-size: 16px; }

  .big {
    margin-top: auto;
    width: 100%; height: 72px;
    border: 0; border-radius: 20px;
    background: var(--accent); color: #fff;
    font-size: 24px; font-weight: 700;
  }
  .big:active { filter: brightness(.9); }
  .version { color: var(--muted); text-align: center; font-size: 13px; margin: 12px 0 0; }

  /* Laufanzeige */
  #run { text-align: center; }
  .phase { font-size: 32px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; margin-top: 4vh; overflow-wrap: anywhere; }
  .round { font-size: 22px; margin-top: 8px; opacity: .9; }
  .time {
    font-size: min(30vw, 34vh);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    margin: auto 0 0;
  }
  .bar-wrap { height: 10px; background: rgba(0,0,0,.25); border-radius: 5px; overflow: hidden; margin: 24px 0 12px; }
  .bar { height: 100%; background: rgba(255,255,255,.85); transform-origin: left; transform: scaleX(0); }
  .remaining { font-size: 17px; opacity: .85; }
  .controls { display: flex; gap: 12px; margin-top: auto; padding-top: 24px; }
  .controls button {
    flex: 1; height: 68px;
    border: 0; border-radius: 20px;
    background: rgba(0,0,0,.28); color: #fff;
    font-size: 22px; font-weight: 600;
  }
  .controls button:active { background: rgba(0,0,0,.4); }
</style>
</head>
<body>

<section id="setup" class="screen active">
  <h1>Intervall-Timer</h1>

  <div class="row" data-key="work">
    <span class="label">Aktivität</span>
    <div class="stepper">
      <button class="step" data-d="-1" aria-label="weniger">−</button>
      <output class="val"></output>
      <button class="step" data-d="1" aria-label="mehr">+</button>
    </div>
  </div>
  <div class="row" data-key="rest">
    <span class="label">Pause</span>
    <div class="stepper">
      <button class="step" data-d="-1" aria-label="weniger">−</button>
      <output class="val"></output>
      <button class="step" data-d="1" aria-label="mehr">+</button>
    </div>
  </div>
  <div class="names-card">
    <div class="row" data-key="exercises">
      <button class="names-toggle" id="namesToggle" aria-expanded="false" aria-controls="namesList">
        <span class="label">Übungen</span>
        <span class="names-count" id="namesCount"></span>
      </button>
      <div class="stepper">
        <button class="step" data-d="-1" aria-label="weniger">−</button>
        <output class="val"></output>
        <button class="step" data-d="1" aria-label="mehr">+</button>
      </div>
    </div>
    <div class="names-list" id="namesList" hidden></div>
  </div>
  <div class="row" data-key="rounds">
    <span class="label">Runden</span>
    <div class="stepper">
      <button class="step" data-d="-1" aria-label="weniger">−</button>
      <output class="val"></output>
      <button class="step" data-d="1" aria-label="mehr">+</button>
    </div>
  </div>
  <div class="row" data-key="roundRest" id="roundRestRow">
    <span class="label">Rundenpause</span>
    <div class="stepper">
      <button class="step" data-d="-1" aria-label="weniger">−</button>
      <output class="val"></output>
      <button class="step" data-d="1" aria-label="mehr">+</button>
    </div>
  </div>
  <div class="row" data-key="prep">
    <span class="label">Vorlauf</span>
    <div class="stepper">
      <button class="step" data-d="-1" aria-label="weniger">−</button>
      <output class="val"></output>
      <button class="step" data-d="1" aria-label="mehr">+</button>
    </div>
  </div>

  <label class="row toggle-row">
    <span class="label">Musik weiterlaufen</span>
    <input type="checkbox" class="switch" id="musicToggle">
  </label>
  <p class="hint" id="musicHint"></p>

  <p class="total" id="setupTotal"></p>

  <button class="big" id="startBtn">Start</button>
  <!-- Bei jeder Änderung der App um eins erhöhen -->
  <p class="version">Version 1</p>
</section>

<section id="run" class="screen">
  <div class="phase" id="phase"></div>
  <div class="round" id="round"></div>
  <div class="time" id="time">0:00</div>
  <div class="bar-wrap"><div class="bar" id="bar"></div></div>
  <div class="remaining" id="remaining"></div>
  <div class="controls">
    <button id="pauseBtn">Pause</button>
    <button id="stopBtn">Beenden</button>
  </div>
</section>

<script>
const STORAGE_KEY = 'intervall-timer:v1';
const DEFAULTS = { work: 30, rest: 15, exercises: 1, rounds: 8, roundRest: 60, prep: 10, music: true, names: [] };
const LIMITS = { work: [5, 3600], rest: [0, 3600], exercises: [1, 30], rounds: [1, 99], roundRest: [0, 3600], prep: [0, 60] };
const COUNT_KEYS = ['exercises', 'rounds'];
const NAME_MAX = 40;
const PHASE_LABEL = { prep: 'Bereit machen', work: 'Aktivität', rest: 'Pause', roundRest: 'Rundenpause' };

const $ = s => document.querySelector(s);

// ---------- Einstellungen ----------
function clamp(key, v) {
  const [min, max] = LIMITS[key];
  return Math.min(max, Math.max(min, Math.round(v)));
}

function load() {
  const s = { ...DEFAULTS };
  try {
    const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
    for (const k of Object.keys(DEFAULTS)) {
      if (!stored) break;
      if (typeof DEFAULTS[k] === 'boolean') {
        if (typeof stored[k] === 'boolean') s[k] = stored[k];
      } else if (Array.isArray(DEFAULTS[k])) {
        if (Array.isArray(stored[k])) {
          s[k] = stored[k].slice(0, LIMITS.exercises[1]).map(n => typeof n === 'string' ? n.slice(0, NAME_MAX) : '');
        }
      } else if (Number.isFinite(stored[k])) {
        s[k] = clamp(k, stored[k]);
      }
    }
    // Alte Einstellungen mit benannten Runden: jede Runde war eine eigene Übung
    if (stored && !('exercises' in stored) && s.names.slice(0, s.rounds).some(n => n.trim())) {
      s.exercises = clamp('exercises', s.rounds);
      s.rounds = 1;
    }
  } catch (e) {}
  return s;
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(settings)); } catch (e) {}
}

let settings = load();

function fmt(sec) {
  sec = Math.max(0, Math.ceil(sec));
  return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
}

// Zeiten: 5-s-Schritte, ab 2 Minuten 15-s-Schritte
function stepValue(key, v, d) {
  if (COUNT_KEYS.includes(key)) return clamp(key, v + d);
  const size = (d > 0 ? v >= 120 : v > 120) ? 15 : 5;
  return clamp(key, v + d * size);
}

function renderSetup() {
  for (const row of document.querySelectorAll('.row[data-key]')) {
    const key = row.dataset.key;
    const v = settings[key];
    let text;
    if (COUNT_KEYS.includes(key)) text = String(v);
    else if (v === 0) text = 'aus';
    else text = fmt(v);
    row.querySelector('.val').textContent = text;
  }
  // Bei nur einer Übung ist jede Pause zugleich Rundenpause
  $('#roundRestRow').hidden = settings.exercises < 2;
  $('#musicToggle').checked = settings.music;
  $('#musicHint').textContent = settings.music
    ? 'Töne laufen über der Musik, sind im Stummmodus aber stumm.'
    : 'Töne auch im Stummmodus, laufende Musik wird aber angehalten.';
  renderNames();
  const plan = buildPlan(settings);
  $('#setupTotal').textContent = 'Gesamtdauer ' + fmt(plan[plan.length - 1].end);
}

// ---------- Übungsnamen ----------
// Namen über der aktuellen Übungszahl bleiben gespeichert, falls die Übungen wieder erhöht werden
function exerciseName(x) {
  return (settings.names[x - 1] || '').trim();
}

function renderNamesCount() {
  let n = 0;
  for (let x = 1; x <= settings.exercises; x++) if (exerciseName(x)) n++;
  $('#namesCount').textContent = n ? `${n} benannt` : 'benennen';
}

$('#namesToggle').addEventListener('click', e => {
  const open = e.currentTarget.getAttribute('aria-expanded') !== 'true';
  e.currentTarget.setAttribute('aria-expanded', open);
  $('#namesList').hidden = !open;
});

// Nur fehlende Felder ergänzen bzw. überzählige entfernen, damit Fokus und Eingabe erhalten bleiben
function renderNames() {
  const list = $('#namesList');
  while (list.children.length > settings.exercises) list.lastElementChild.remove();
  for (let i = list.children.length; i < settings.exercises; i++) {
    const input = document.createElement('input');
    input.className = 'name-input';
    input.type = 'text';
    input.maxLength = NAME_MAX;
    input.placeholder = `Übung ${i + 1}`;
    input.enterKeyHint = 'next';
    input.autocomplete = 'off';
    input.value = settings.names[i] || '';
    input.addEventListener('input', () => {
      settings.names[i] = input.value;
      save();
      renderNamesCount();
    });
    input.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const next = input.nextElementSibling;
      if (next) next.focus(); else input.blur();
    });
    list.append(input);
  }
  renderNamesCount();
}

$('#musicToggle').addEventListener('change', e => {
  settings.music = e.target.checked;
  save();
  renderSetup();
});

// Gedrückt halten wiederholt den Schritt
for (const btn of document.querySelectorAll('.step')) {
  const key = btn.closest('.row').dataset.key;
  const d = Number(btn.dataset.d);
  let delay = null, repeat = null;
  const apply = () => { settings[key] = stepValue(key, settings[key], d); renderSetup(); save(); };
  const stop = () => { clearTimeout(delay); clearInterval(repeat); delay = repeat = null; };
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    apply();
    delay = setTimeout(() => { repeat = setInterval(apply, 90); }, 400);
  });
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) btn.addEventListener(ev, stop);
  btn.addEventListener('click', e => { if (e.detail === 0) apply(); }); // Tastatur
}

// ---------- Ablaufplan ----------
// Jede Runde durchläuft alle Übungen; Pause zwischen den Übungen,
// zwischen den Runden die Rundenpause (bei nur einer Übung die normale Pause)
function buildPlan(s) {
  const segs = [];
  if (s.prep > 0) segs.push({ type: 'prep', dur: s.prep, round: 0, ex: 0 });
  for (let r = 1; r <= s.rounds; r++) {
    for (let x = 1; x <= s.exercises; x++) {
      segs.push({ type: 'work', dur: s.work, round: r, ex: x });
      if (r === s.rounds && x === s.exercises) break;
      const roundBreak = x === s.exercises && s.exercises > 1;
      const dur = roundBreak ? s.roundRest : s.rest;
      if (dur > 0) segs.push({ type: 'rest', dur, round: r, ex: x, roundBreak });
    }
  }
  let t = 0;
  for (const seg of segs) { seg.start = t; t += seg.dur; seg.end = t; }
  return segs;
}

// ---------- Ton ----------
let ctx = null, sessionType = null;

function ensureAudio() {
  // Safari 17+: 'ambient' mischt sich mit Musik, ist im Stummmodus aber stumm;
  // 'playback' klingt auch im Stummmodus, hält andere Wiedergabe aber an
  const type = settings.music ? 'ambient' : 'playback';
  if (type !== sessionType) {
    try { if (navigator.audioSession) navigator.audioSession.type = type; } catch (e) {}
    if (ctx) { ctx.close(); ctx = null; }
    sessionType = type;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  if (!ctx) ctx = new AC();
  if (ctx.state !== 'running') ctx.resume();
  // stiller Puffer entsperrt die Wiedergabe auf iOS
  const src = ctx.createBufferSource();
  src.buffer = ctx.createBuffer(1, 1, 22050);
  src.connect(ctx.destination);
  src.start(0);
}

function tone(freq, dur, when = 0, vol = 0.45) {
  if (!ctx) return;
  const t = ctx.currentTime + when;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  gain.gain.setValueAtTime(vol, t + dur - 0.03);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t);
  osc.stop(t + dur + 0.02);
}

const sounds = {
  tick: () => tone(784, 0.12),
  work: () => tone(1047, 0.5),
  rest: () => tone(523, 0.5),
  done: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, i === 3 ? 0.6 : 0.16, i * 0.16)); },
};

// ---------- Bildschirm wachhalten ----------
let wakeLock = null;

async function requestWake() {
  try { if ('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  if (wakeLock) wakeLock.addEventListener('release', () => { wakeLock = null; }, { once: true });
}

function releaseWake() {
  try { if (wakeLock) wakeLock.release(); } catch (e) {}
  wakeLock = null;
}

// ---------- Ablauf ----------
let plan = [], state = 'setup', startedAt = 0, offset = 0, lastSeg = -1, lastSec = -1, timer = null;

function elapsed() {
  return state === 'running' ? offset + (performance.now() - startedAt) / 1000 : offset;
}

function show(id) {
  for (const s of document.querySelectorAll('.screen')) s.classList.toggle('active', s.id === id);
}

function progressText(seg) {
  const { rounds, exercises } = settings;
  if (!seg.round) return exercises > 1 ? `${rounds} Runden à ${exercises} Übungen` : `${rounds} Runden`;
  const r = `Runde ${seg.round} / ${rounds}`;
  return exercises > 1 ? `${r} · Übung ${seg.ex} / ${exercises}` : r;
}

function renderPhase(i) {
  const seg = plan[i];
  document.body.dataset.phase = seg.type;
  const name = seg.type === 'work' && exerciseName(seg.ex);
  $('#phase').textContent = name || PHASE_LABEL[seg.roundBreak ? 'roundRest' : seg.type];
  // In Vorlauf und Pause die nächste Übung ankündigen, sofern sie einen Namen hat
  const nextSeg = seg.type !== 'work' && plan[i + 1];
  const next = nextSeg && exerciseName(nextSeg.ex);
  $('#round').textContent = next ? 'Als Nächstes: ' + next : progressText(seg);
}

function tick() {
  const e = elapsed();
  const total = plan[plan.length - 1].end;
  if (e >= total) { finish(); return; }

  let i = Math.max(lastSeg, 0);
  while (i < plan.length - 1 && e >= plan[i].end) i++;
  const seg = plan[i];
  const rem = seg.end - e;
  const sec = Math.ceil(rem);

  if (i !== lastSeg) {
    if (sounds[seg.type]) sounds[seg.type]();
    lastSeg = i;
    lastSec = sec;
    renderPhase(i);
  } else if (sec !== lastSec) {
    lastSec = sec;
    if (sec >= 1 && sec <= 3) sounds.tick();
  }

  $('#time').textContent = fmt(rem);
  $('#bar').style.transform = `scaleX(${1 - rem / seg.dur})`;
  $('#remaining').textContent = 'Gesamt noch ' + fmt(total - e);
}

function start() {
  ensureAudio();
  save();
  plan = buildPlan(settings);
  offset = 0;
  lastSeg = lastSec = -1;
  startedAt = performance.now();
  state = 'running';
  $('#pauseBtn').textContent = 'Pause';
  show('run');
  requestWake();
  clearInterval(timer);
  timer = setInterval(tick, 50);
  tick();
}

function pause() {
  offset = elapsed();
  state = 'paused';
  $('#pauseBtn').textContent = 'Weiter';
}

function resume() {
  ensureAudio();
  startedAt = performance.now();
  state = 'running';
  $('#pauseBtn').textContent = 'Pause';
}

function finish() {
  clearInterval(timer);
  state = 'done';
  sounds.done();
  document.body.dataset.phase = 'done';
  $('#phase').textContent = 'Fertig!';
  $('#round').textContent = `${settings.rounds} Runden geschafft`;
  $('#time').textContent = '0:00';
  $('#bar').style.transform = 'scaleX(1)';
  $('#remaining').textContent = '';
  $('#pauseBtn').textContent = 'Nochmal';
  $('#stopBtn').textContent = 'Zurück';
  releaseWake();
}

function stop() {
  clearInterval(timer);
  state = 'setup';
  delete document.body.dataset.phase;
  $('#stopBtn').textContent = 'Beenden';
  releaseWake();
  renderSetup();
  show('setup');
}

$('#startBtn').addEventListener('click', start);

$('#pauseBtn').addEventListener('click', () => {
  if (state === 'running') pause();
  else if (state === 'paused') resume();
  else if (state === 'done') { $('#stopBtn').textContent = 'Beenden'; start(); }
});

$('#stopBtn').addEventListener('click', () => {
  if (state === 'done') { stop(); return; }
  const wasRunning = state === 'running';
  if (wasRunning) pause();
  if (confirm('Training beenden?')) stop();
  else if (wasRunning) resume();
});

// Nach Rückkehr in die App: Bildschirmsperre und Ton wiederherstellen
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && (state === 'running' || state === 'paused')) {
    requestWake();
    if (ctx && ctx.state !== 'running') ctx.resume();
  }
});
document.addEventListener('touchstart', () => {
  if (ctx && ctx.state !== 'running') ctx.resume();
}, { passive: true });

renderSetup();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
